x-app-environment: &app-environment
  APP_ENVIRONMENT: development
  APP_VERSION: 0.6.0
  DATABASE_URL: postgresql+psycopg://homelab_pulse:homelab_pulse@database:5432/homelab_pulse
  REDIS_URL: redis://redis:6379/0
  API_BASE_URL: http://api:8000
  JWT_SECRET: development-secret-change-before-production
  MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}

services:
  api:
    build: .
    environment: *app-environment
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command:
      - celery
      - -A
      - homelab_pulse.celery_app:celery_app
      - worker
      - --loglevel=info
      - --pool=solo
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build: .
    command:
      - celery
      - -A
      - homelab_pulse.celery_app:celery_app
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    environment: *app-environment
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy

  dashboard:
    build: .
    command:
      - python
      - -m
      - homelab_pulse.dashboard
    environment: *app-environment
    ports:
      - "8050:8050"
    depends_on:
      - api

  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: homelab_pulse
      POSTGRES_USER: homelab_pulse
      POSTGRES_PASSWORD: homelab_pulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelab_pulse -d homelab_pulse"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
