services:
  agent:
    build: .
    command:
      - uvicorn
      - homelab_pulse.agent:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
    environment:
      APP_VERSION: 0.4.0
      AGENT_TOKEN: ${AGENT_TOKEN}
      DOCKER_API_URL: http://docker-proxy:2375
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      - docker-proxy
    networks:
      - agent_internal

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1
      INFO: 1
      PING: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - agent_internal

networks:
  agent_internal:
    internal: true
