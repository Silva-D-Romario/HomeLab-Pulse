services:
  - type: web
    name: homelab-pulse-api
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: APP_VERSION
        value: 0.8.0
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homelab-pulse-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CREDENTIAL_ENCRYPTION_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: homelab-pulse
      - key: JWT_AUDIENCE
        value: homelab-pulse-api
      - key: MONITOR_INTERVAL_SECONDS
        value: 60

  - type: web
    name: homelab-pulse-dashboard
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: gunicorn homelab_pulse.dashboard:server --bind 0.0.0.0:$PORT --workers 2
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: DATABASE_URL
      - key: JWT_SECRET
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: JWT_SECRET
      - key: CREDENTIAL_ENCRYPTION_SECRET
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: CREDENTIAL_ENCRYPTION_SECRET
      - key: API_BASE_URL
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: worker
    name: homelab-pulse-worker
    runtime: docker
    plan: 0.5c-512mb
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: celery -A homelab_pulse.celery_app:celery_app worker --beat --loglevel=info --pool=solo --schedule=/tmp/celerybeat-schedule
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: DATABASE_URL
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: homelab-pulse-redis
          property: connectionString
      - key: JWT_SECRET
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: JWT_SECRET
      - key: CREDENTIAL_ENCRYPTION_SECRET
        fromService:
          type: web
          name: homelab-pulse-api
          envVarKey: CREDENTIAL_ENCRYPTION_SECRET
      - key: MONITOR_INTERVAL_SECONDS
        value: 60

  - type: keyvalue
    name: homelab-pulse-redis
    plan: free
    region: virginia
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
